<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #eef0f6; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1e2430; padding: 36px; width: 600px;
  }
  .wrap { width: 528px; }
  .cap { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 9px; }
  .cap .dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg,#6d5ce7,#2db7a3); }
  .cap small { font-weight: 500; color: #6b7280; font-size: 12.5px; }
  .selector {
    background: #fff; border-radius: 16px; padding: 14px;
    box-shadow: 0 16px 44px rgba(38,44,70,.14);
  }
  .field {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid #6d5ce7; border-radius: 11px;
    padding: 11px 13px; background: #faf9ff;
  }
  .field .name { font-size: 15px; font-weight: 700; }
  .field .gear { font-size: 11.5px; color: #6d5ce7; font-weight: 600; background:#efeaff; padding:2px 8px; border-radius:6px; }
  .field .chev { margin-left: auto; color: #9aa1b1; }
  .logo { width: 26px; height: 26px; flex: none; }
  .list { margin-top: 10px; }
  .group { font-size: 11px; font-weight: 700; color: #9aa1b1; letter-spacing: .6px; padding: 9px 8px 6px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 10px; }
  .row .txt { display: flex; flex-direction: column; }
  .row .m { font-size: 14px; font-weight: 600; }
  .row .d { font-size: 11.5px; color: #8b93a3; margin-top: 2px; }
  .row.auto { background: linear-gradient(135deg, rgba(109,92,231,.12), rgba(45,183,163,.12)); border: 1px solid rgba(109,92,231,.35); }
  .row.auto .m { color: #4b3fc4; }
  .row .check { margin-left: auto; color: #2db7a3; }
  .row.dim .m { color: #5b6472; font-weight: 500; }
  .swatch { width: 26px; height: 26px; border-radius: 7px; flex: none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
  .sep { height: 1px; background: #eceef3; margin: 8px 4px; }
  .callout {
    margin-top: 16px; display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; color: #4b5563;
  }
  .callout .pill { background: linear-gradient(135deg,#6d5ce7,#2db7a3); color:#fff; font-weight:600; padding:7px 14px; border-radius:999px; font-size:13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cap"><span class="dot"></span>使用入口 <small>· 模型选择器里多一个 Auto 挡</small></div>
    <div class="selector">
      <div class="field">
        <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6d5ce7"/><stop offset="1" stop-color="#2db7a3"/></linearGradient></defs>
          <path d="M32 5 57 49a7 7 0 0 1-6 10H13a7 7 0 0 1-6-10L26 5a7 7 0 0 1 12 0Z" fill="url(#g)"/>
          <path d="m21 45 11-25 11 25h-6l-2.2-5H28l-2 5h-5Zm9-10h3.5L32 30.5 30 35Z" fill="#fff"/>
        </svg>
        <span class="name">Auto</span>
        <span class="gear">自动挡</span>
        <span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="list">
        <div class="group">Model Autoshift</div>
        <div class="row auto">
          <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 5 57 49a7 7 0 0 1-6 10H13a7 7 0 0 1-6-10L26 5a7 7 0 0 1 12 0Z" fill="url(#g)"/>
            <path d="m21 45 11-25 11 25h-6l-2.2-5H28l-2 5h-5Zm9-10h3.5L32 30.5 30 35Z" fill="#fff"/>
          </svg>
          <span class="txt"><span class="m">Auto</span><span class="d">按任务自动选模型 · 一个会话一条路线</span></span>
          <span class="check"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
        <div class="sep"></div>
        <div class="group">已配置的模型</div>
        <div class="row dim"><span class="swatch" style="background:#4d6bfe">D</span><span class="txt"><span class="m">deepseek-chat</span><span class="d">官方</span></span></div>
        <div class="row dim"><span class="swatch" style="background:#10a37f">G</span><span class="txt"><span class="m">gpt-4o-mini</span><span class="d">中转</span></span></div>
        <div class="row dim"><span class="swatch" style="background:#ea8a3a">M</span><span class="txt"><span class="m">gemini-2.5-flash</span><span class="d">中转</span></span></div>
      </div>
    </div>
    <div class="callout"><span class="pill">选 Auto</span>其余模型照常参与调度，不用手动挑</div>
  </div>
</body>
</html>
