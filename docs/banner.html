<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 300px; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(120deg, #5b4bd6 0%, #6d5ce7 38%, #2db7a3 100%);
    color: #fff; position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 0 64px;
  }
  .deco { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
  .d1 { width: 360px; height: 360px; right: -90px; top: -120px; }
  .d2 { width: 220px; height: 220px; right: 150px; bottom: -110px; background: rgba(255,255,255,.06); }
  .d3 { width: 120px; height: 120px; left: 46%; top: -50px; background: rgba(255,255,255,.05); }
  .logo { width: 132px; height: 132px; flex: none; margin-right: 40px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.18)); }
  .text { position: relative; z-index: 2; }
  .name { font-size: 58px; font-weight: 800; letter-spacing: .5px; line-height: 1.05; }
  .zh { font-size: 27px; font-weight: 600; opacity: .92; margin-top: 8px; letter-spacing: 4px; }
  .tag { font-size: 19px; opacity: .9; margin-top: 16px; font-weight: 500; }
  .gear {
    position: absolute; right: 64px; bottom: 40px; z-index: 2;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35);
    padding: 10px 22px; border-radius: 999px; font-size: 18px; font-weight: 700;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
  <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div>
  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 5 57 49a7 7 0 0 1-6 10H13a7 7 0 0 1-6-10L26 5a7 7 0 0 1 12 0Z" fill="#fff"/>
    <path d="m21 45 11-25 11 25h-6l-2.2-5H28l-2 5h-5Zm9-10h3.5L32 30.5 30 35Z" fill="#6d5ce7"/>
  </svg>
  <div class="text">
    <div class="name">Model Autoshift</div>
    <div class="zh">模型自动挡</div>
    <div class="tag">One Auto gear for your whole model pool · zero extra calls</div>
  </div>
  <div class="gear">Shift to Auto</div>
</body>
</html>
